name: release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_IMAGE: overvenus/corplink
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/corplink-headless

jobs:
  docker-image:
    if: github.event_name != 'push' || github.ref_name != 'latest'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  runtime-bundles:
    if: github.event_name != 'push' || github.ref_name != 'latest'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release tarball
        run: |
          mkdir -p dist
          bash ./scripts/package_runtime.sh \
            "${{ matrix.arch }}" \
            "dist/corplink-headless-runtime-linux-${{ matrix.arch }}.tar.gz"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Upload runtime tarball
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.arch }}
          path: dist/corplink-headless-runtime-linux-${{ matrix.arch }}.tar.gz

  github-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name != 'latest'
    needs:
      - runtime-bundles
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect master release
        id: master-release
        run: |
          if git branch -r --contains "$GITHUB_SHA" | grep -Eq 'origin/master$'; then
            echo "should_publish_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download runtime tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          (cd dist && sha256sum ./*.tar.gz > corplink-headless-runtime-sha256sum.txt)

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/*.tar.gz
            dist/corplink-headless-runtime-sha256sum.txt

      - name: Create or update latest tag
        if: steps.master-release.outputs.should_publish_latest == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = 'tags/latest';
            const sha = context.sha;

            try {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref,
                sha,
                force: true,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/${ref}`,
                sha,
              });
            }

      - name: Delete existing latest release
        if: steps.master-release.outputs.should_publish_latest == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: 'latest',
              });

              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Publish latest release assets
        if: steps.master-release.outputs.should_publish_latest == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: |
            Latest runtime artifacts from `${{ github.ref_name }}`.
          overwrite_files: true
          files: |
            dist/*.tar.gz
            dist/corplink-headless-runtime-sha256sum.txt

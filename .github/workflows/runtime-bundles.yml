name: runtime-bundles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-runtime-bundles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build runtime tarball
        run: |
          mkdir -p dist
          bash ./scripts/package_runtime.sh \
            "${{ matrix.arch }}" \
            "dist/corplink-headless-runtime-linux-${{ matrix.arch }}.tar.gz"

      - name: Upload runtime tarball
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.arch }}
          path: dist/corplink-headless-runtime-linux-${{ matrix.arch }}.tar.gz
